<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<title>Waldbrände in Frankreich und Spanien</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
	<link rel="canonical" href="index-de.html">
	<style>
		body { font-family: system-ui, -apple-system, sans-serif; background: #FFFFFF; color: #000000;
		       margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
		a { color: #000000; }
	</style>
	<script>
		/* Damit auch ein Aufruf des Verzeichnisses direkt in der Anwendung landet,
		   statt eine Dateiliste zu zeigen.

		   Anker UND Query werden mitgenommen. Der Anker allein genügte, solange es
		   nur ihn gab; die Auswahl der gezeigten Brände steht aber in der Query
		   (?nur=), und die fiel hier still weg — eine eingebettete Fassung mit
		   festgelegter Auswahl hätte über diesen Weg wieder alle Brände gezeigt. */
		(function () {
			var lang = (navigator.language || 'de').slice(0, 2).toLowerCase();
			var page = lang === 'de' ? 'index-de.html' : 'index-en.html';
			window.location.replace(page + window.location.search + window.location.hash);
		})();
	</script>
</head>
<body>

		<a href="index-en.html">English version</a><br>
