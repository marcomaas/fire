<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<title>Layout-Regressionstests</title>
	<meta name="robots" content="noindex">
	<style>
		body { font-family: ui-monospace, Menlo, monospace; font-size: 13px; margin: 12px; background: #fff; color: #000; }
		#frames { position: absolute; left: -20000px; top: 0; }
		#frames iframe { border: 0; display: block; }
		pre { white-space: pre-wrap; }
		.p { color: #0a0; }
		.f { color: #c00; font-weight: 700; }
	</style>
</head>
<body>
<h1>Layout-Regressionstests</h1>
<pre id="results">läuft …</pre>
<div id="frames"></div>

<script>
/*
 * Prüft die Anwendung in echten Rahmen mehrerer Größen.
 *
 * Warum im Rahmen und nicht im Fenster: Headless Chrome erzwingt eine
 * Mindestfensterbreite von 500 Pixel. Ein Lauf mit --window-size=400 rendert bei
 * 500 und beschneidet nur das Bild — schmale Layouts lassen sich so nicht
 * prüfen. Ein iframe mit fester Breite gibt dagegen einen echten Viewport.
 *
 * Diese Tests entstanden aus vier tatsächlich aufgetretenen Fehlern:
 *   1. Abspielknopf und Zustandsanzeige lagen unter 720 Pixel übereinander.
 *   2. Die Leaflet-Herkunftsangabe umbrach und verdeckte beide.
 *   3. Der Schließen-Knopf war weiße Schrift auf weißem Grund.
 *   4. Die Quellen- und Lizenzangaben waren im Rahmen nicht erreichbar, weil
 *      dort die Kopfzeile samt Info-Knopf ausgeblendet wird.
 */

var VIEWPORTS = [
	{ name: '360x640 Telefon', w: 360, h: 640 },
	/* Schmal UND flach zugleich — der ungünstigste Fall, den eine Einbettung in
	 * einer Seitenspalte erzeugt. Vorher war nur je eine der beiden Engen
	 * geprüft (360x640 schmal, 500x400 flach), nie beide gemeinsam. */
	{ name: '420x380 schmal und flach', w: 420, h: 380 },
	{ name: '400x720 Hochformat', w: 400, h: 720 },
	{ name: '500x400 flach', w: 500, h: 400 },
	{ name: '960x540 Querformat', w: 960, h: 540 },
	{ name: '1280x800 Vollbild', w: 1280, h: 800 },
	/* Rahmen, der seine Größe erst nach dem Laden bekommt. Reproduziert den Fall,
	 * in dem fitBounds die Zoomstufe aus einer Containergröße von null berechnet
	 * und Leaflet auf die kleinste Stufe zurückfällt — statt des Brandes war dann
	 * halb Europa zu sehen. Ohne diesen Fall bliebe die Zoom-Prüfung wirkungslos:
	 * bei sofort bemaßten Rahmen tritt der Fehler nicht auf. */
	{ name: '470x470 Größe erst nach dem Laden', w: 470, h: 470, lateSize: true }
];

var PAGES = ['../app/index-de.html', '../app/index-en.html'];

/* Sichtbare Kästen, die sich nie überlagern dürfen. Der Container .panel-stack
 * wird absichtlich nicht geprüft: er ist transparent, ohne Zeigerereignisse und
 * reicht bauartbedingt weit nach unten — geprüft werden die Kästen darin. */
var BOXES = [
	'#map-controls',
	'#map-startstop',
	'#map-fires',
	'#map-compare',
	/* Tritt bei flachen Rahmen an die Stelle der beiden Listen. Steht mit in
	 * dieser Liste, damit die Prüfungen auf Sichtbereich und Überlagerung auch
	 * für die kompakte Darstellung gelten — sonst wäre gerade die engste
	 * Rahmengröße die am wenigsten geprüfte. */
	'#map-picker',
	'.leaflet-control-attribution'
];

var lines = [];
var pass = 0;
var fail = 0;

function check(label, ok, detail) {
	if (ok) { pass++; lines.push('PASS ' + label); }
	else { fail++; lines.push('FAIL ' + label + (detail ? ' — ' + detail : '')); }
}

function rect(el) {
	var r = el.getBoundingClientRect();
	return { l: r.left, t: r.top, r: r.right, b: r.bottom, w: r.width, h: r.height };
}

function overlap(a, b) {
	/* Ein Pixel Toleranz: aneinander anliegende Kanten sind keine Überlagerung. */
	var x = Math.min(a.r, b.r) - Math.max(a.l, b.l);
	var y = Math.min(a.b, b.b) - Math.max(a.t, b.t);
	return x > 1 && y > 1 ? Math.round(x) + '×' + Math.round(y) + ' px' : null;
}

function visible(el) {
	if (!el) return false;
	var r = rect(el);
	var cs = getComputedStyle(el);
	return r.w > 0 && r.h > 0 && cs.visibility !== 'hidden' && cs.display !== 'none' && parseFloat(cs.opacity) > 0.05;
}

/* Sucht die erste nicht durchsichtige Hintergrundfarbe die Elternkette hinauf.
 * Nötig, weil ein Element mit durchsichtigem Hintergrund die Farbe des
 * Vorfahren zeigt — genau so entstand der unsichtbare Schließen-Knopf. */
function effectiveBackground(el, win) {
	var node = el;
	while (node && node !== win.document.documentElement) {
		var bg = win.getComputedStyle(node).backgroundColor;
		if (bg && bg !== 'transparent' && !/rgba\(\s*0,\s*0,\s*0,\s*0\s*\)/.test(bg)) return bg;
		node = node.parentElement;
	}
	return 'rgb(255, 255, 255)';
}

function rgb(str) {
	var m = String(str).match(/(\d+(?:\.\d+)?)/g);
	return m ? m.slice(0, 3).map(Number) : null;
}

/* Grobe Helligkeitsdifferenz. Kein Ersatz für eine Kontrastmessung nach WCAG,
 * aber ausreichend, um Schrift zu finden, die auf ihrem Grund verschwindet. */
function tooSimilar(fg, bg) {
	var a = rgb(fg), b = rgb(bg);
	if (!a || !b) return false;
	var d = Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]);
	return d < 40;
}

function testFrame(page, vp, win, doc) {
	var tag = page.replace('../app/', '') + ' @ ' + vp.name;
	var view = { l: 0, t: 0, r: vp.w, b: vp.h, w: vp.w, h: vp.h };

	/* 1. Kein waagerechtes Überlaufen. Wächst ein Element über die Breite
	 *    hinaus, rutscht alles rechts Positionierte mit hinaus. */
	var de = doc.documentElement;
	check(tag + ' | kein waagerechtes Überlaufen',
		de.scrollWidth <= de.clientWidth + 1,
		'scrollWidth ' + de.scrollWidth + ' > clientWidth ' + de.clientWidth);

	/* 2. Daten geladen — sonst sind alle folgenden Prüfungen wertlos. */
	var size = doc.getElementById('map-size');
	check(tag + ' | Flächenangabe gefüllt', !!size && size.textContent.trim().length > 0);

	/* 3. Kästen vollständig im Sichtbereich. */
	var found = {};
	BOXES.forEach(function (sel) {
		var el = doc.querySelector(sel);
		if (!visible(el)) return;
		found[sel] = rect(el);
		var r = found[sel];
		check(tag + ' | ' + sel + ' im Sichtbereich',
			r.l >= -1 && r.t >= -1 && r.r <= view.r + 1 && r.b <= view.b + 1,
			'links ' + Math.round(r.l) + ' oben ' + Math.round(r.t) +
			' rechts ' + Math.round(r.r) + ' unten ' + Math.round(r.b) +
			' bei ' + vp.w + '×' + vp.h);
	});

	/* 4. Keine Überlagerung zwischen den Kästen. Das ist der Kern: genau hier
	 *    lagen Abspielknopf, Zustandsanzeige und Herkunftsangabe übereinander. */
	var keys = Object.keys(found);
	for (var i = 0; i < keys.length; i++) {
		for (var j = i + 1; j < keys.length; j++) {
			var o = overlap(found[keys[i]], found[keys[j]]);
			check(tag + ' | ' + keys[i] + ' überlagert ' + keys[j] + ' nicht', !o, o);
		}
	}

	/* 5. Herkunftsangabe vorhanden und einzeilig. Umbrach sie, verdeckte sie
	 *    die Bedienelemente. */
	var attr = doc.querySelector('.leaflet-control-attribution');
	check(tag + ' | Herkunftsangabe sichtbar', visible(attr));
	if (visible(attr)) {
		check(tag + ' | Herkunftsangabe einzeilig', rect(attr).h <= 24,
			'Höhe ' + Math.round(rect(attr).h) + ' px');
	}

	/* 6. Quellen und Lizenz erreichbar — auch im Rahmen, wo die Kopfzeile
	 *    ausgeblendet wird. */
	var route = doc.querySelector('.attr-info') || doc.getElementById('button-info');
	check(tag + ' | Route zu Quellen und Lizenz vorhanden', !!route);
	if (route) {
		route.click();
		var open = doc.getElementById('main').classList.contains('show-info');
		check(tag + ' | Info-Kasten öffnet sich', open);
		var closer = doc.querySelector('#info .overlay-close');
		check(tag + ' | Schließen-Knopf sichtbar', visible(closer));
		if (closer) {
			/* 7. Schrift darf nicht auf ihrem Grund verschwinden. */
			var cs = win.getComputedStyle(closer);
			var bg = effectiveBackground(closer, win);
			check(tag + ' | Schließen-Knopf lesbar', !tooSimilar(cs.color, bg),
				'Schrift ' + cs.color + ' auf ' + bg);
		}
		if (open) route.click();
	}

	/* 7b. Die Brandfläche liegt nicht hinter den Kästen. Prüfung 8 misst nur, ob
	 *     der Ausschnitt auf dem Brand sitzt — bei 420×380 war er das, und
	 *     trotzdem war von der Fläche nichts zu sehen, weil die Zustandsanzeige
	 *     genau darüber lag. Gemessen wird der Anteil der Umschließung der
	 *     Brandfläche, der von keinem Kasten belegt ist. Die Summe der
	 *     Schnittflächen ist dabei exakt, weil Prüfung 4 sicherstellt, dass sich
	 *     die Kästen nicht gegenseitig überlagern. */
	var flaeche = doc.querySelector('.leaflet-overlay-pane path');
	if (flaeche) {
		var fr = flaeche.getBoundingClientRect();
		var fBox = { l: fr.left, t: fr.top, r: fr.right, b: fr.bottom };
		var gesamt = Math.max(1, (fBox.r - fBox.l) * (fBox.b - fBox.t));
		var belegt = 0;
		var deckel = [];
		BOXES.forEach(function (sel) {
			var el = doc.querySelector(sel);
			if (!visible(el)) return;
			var b = rect(el);
			var x = Math.min(fBox.r, b.r) - Math.max(fBox.l, b.l);
			var y = Math.min(fBox.b, b.b) - Math.max(fBox.t, b.t);
			if (x > 0 && y > 0) {
				belegt += x * y;
				deckel.push(sel + ' ' + Math.round(x * y / gesamt * 100) + ' %');
			}
		});
		var frei = 1 - belegt / gesamt;
		check(tag + ' | Brandfläche nicht hinter den Kästen', frei >= 0.5,
			'nur ' + Math.round(frei * 100) + ' % frei — verdeckt von ' +
			(deckel.join(', ') || 'nichts') + '; Fläche ' +
			Math.round(fBox.l) + ',' + Math.round(fBox.t) + ' ' +
			Math.round(fBox.r - fBox.l) + '×' + Math.round(fBox.b - fBox.t));
	}

	/* 8. Der Kartenausschnitt sitzt auf dem Brand. Ohne diese Prüfung fiel es
	 *    nicht auf, dass fitBounds in kleinen Rahmen auf die kleinste Zoomstufe
	 *    zurückfällt: die Containergröße stand beim Aufruf noch nicht fest, und
	 *    statt des Brandes war halb Europa zu sehen. Geprüft wird die gezeichnete
	 *    Fläche selbst — bei falscher Zoomstufe schrumpft sie auf wenige Pixel. */
	var burnt = doc.querySelector('.leaflet-overlay-pane path');
	check(tag + ' | Brandfläche gezeichnet', !!burnt);
	if (burnt) {
		var bb = burnt.getBoundingClientRect();
		var anteil = Math.max(bb.width / vp.w, bb.height / vp.h);
		check(tag + ' | Kartenausschnitt sitzt auf dem Brand', anteil >= 0.12,
			'größte Ausdehnung nur ' + (anteil * 100).toFixed(1) + ' % des Rahmens ' +
			'(' + Math.round(bb.width) + '×' + Math.round(bb.height) + ' px)');
	}

	/* 9. Zeitstrahl aufgebaut: Marken je Aufnahme, Beschriftung, Zusammenfassung. */
	var ticks = doc.querySelectorAll('#timeline-ticks .timeline-tick:not(.outbreak)');
	check(tag + ' | eine Zeitmarke je Aufnahme', ticks.length >= 2,
		ticks.length + ' Marken');
	var von = doc.getElementById('timeline-from');
	var bis = doc.getElementById('timeline-to');
	check(tag + ' | Zeitachse beschriftet',
		!!von && !!bis && von.textContent.trim() && bis.textContent.trim());
	var zus = doc.getElementById('timeline-summary');
	check(tag + ' | Zeitstrahl-Zusammenfassung gefüllt',
		!!zus && zus.textContent.trim().length > 0);
	/* Die Marken müssen innerhalb der Achse liegen — bei einem Rechenfehler in
	 * der Positionierung ragen sie sonst aus dem Kasten heraus. */
	if (ticks.length) {
		var achse = rect(doc.getElementById('timeline-track'));
		var raus = [];
		Array.prototype.forEach.call(ticks, function (t) {
			var r = rect(t);
			if (r.l < achse.l - 2 || r.r > achse.r + 2) raus.push(Math.round(r.l));
		});
		check(tag + ' | Zeitmarken innerhalb der Achse', raus.length === 0,
			raus.length + ' außerhalb');
	}

	/* 10. Abspielknopf beschriftet und bedienbar. */
	var play = doc.getElementById('map-startstop');
	check(tag + ' | Abspielknopf sichtbar', visible(play));
	var label = doc.getElementById('map-startstop-label');
	check(tag + ' | Abspielknopf beschriftet', !!label && label.textContent.trim().length > 0);

	/* 11. Genau eine Auswahl ist sichtbar. Bei flachen Rahmen treten die
	 *     Auswahlfelder an die Stelle der Listen. Wären beide gleichzeitig da,
	 *     stünden zwei Bedienwege übereinander; wäre keiner da, ließe sich der
	 *     Brand nicht wechseln. */
	var stack = doc.querySelector('.panel-stack');
	var picker = doc.getElementById('map-picker');
	var listenAn = visible(stack);
	var felderAn = visible(picker);
	check(tag + ' | genau eine Auswahl sichtbar', listenAn !== felderAn,
		'Listen ' + listenAn + ', Auswahlfelder ' + felderAn);

	/* 12. Jeder Brand ist erreichbar. Das ist die Prüfung, die gefehlt hat: bei
	 *     960×540 lagen vier von fünf Bränden im Kasten, der fünfte darunter —
	 *     scrollbar, aber ohne jeden Hinweis darauf. Erreichbar heißt daher
	 *     entweder sichtbar, oder scrollbar MIT Anzeige. */
	var anzahl = win._fires ? win._fires.length : 0;
	check(tag + ' | Branddaten vorhanden', anzahl > 0);

	if (felderAn) {
		var opts = doc.getElementById('pick-fire');
		check(tag + ' | Auswahlfeld führt jeden Brand',
			!!opts && opts.options.length === anzahl,
			'Feld hat ' + (opts ? opts.options.length : 0) + ' von ' + anzahl);
		/* Der leere Eintrag im Städtefeld ist der Weg zurück zur reinen
		 * Brandfläche — in der Liste leistet das ein zweiter Klick. */
		var stadtFeld = doc.getElementById('pick-city');
		check(tag + ' | Städtefeld erlaubt "ohne Vergleich"',
			!!stadtFeld && stadtFeld.options.length > 1 && stadtFeld.options[0].value === '',
			stadtFeld ? 'erster Wert ' + JSON.stringify(stadtFeld.options[0].value) : 'kein Feld');
	} else if (listenAn) {
		var ul = doc.querySelector('#map-fires ul');
		var eintraege = ul ? ul.querySelectorAll('li') : [];
		check(tag + ' | Liste führt jeden Brand', eintraege.length === anzahl,
			'Liste hat ' + eintraege.length + ' von ' + anzahl);

		if (ul) {
			var box = doc.getElementById('map-fires');
			var verdeckt = 0;
			var ur = rect(ul);
			Array.prototype.forEach.call(eintraege, function (li) {
				var r = rect(li);
				if (r.t < ur.t - 1 || r.b > ur.b + 1) verdeckt++;
			});
			var scrollbar = ul.scrollHeight > ul.clientHeight + 1;
			var angezeigt = box.classList.contains('has-more') ||
				box.classList.contains('has-before');
			check(tag + ' | verdeckte Brände sind angezeigt',
				verdeckt === 0 || (scrollbar && angezeigt),
				verdeckt + ' von ' + eintraege.length + ' außerhalb, scrollbar ' +
				scrollbar + ', Anzeige "' + box.className + '"');

			/* Ab der Höhe, die die Beispielseite als Regelfall ausgibt (960×540),
			 * genügt "scrollbar mit Anzeige" nicht: dort muss die Auswahl
			 * vollständig im Blick sein. Vorher war der fünfte Brand bei genau
			 * dieser Größe unter der Kante, während die Städteliste daneben 233
			 * Pixel belegte. */
			if (vp.h >= 500) {
				check(tag + ' | bei ' + vp.h + ' px Höhe ist die Auswahl vollständig sichtbar',
					verdeckt === 0,
					verdeckt + ' von ' + eintraege.length + ' außerhalb');
			}

			/* Die Städteliste darf nicht zum Schlitz zusammenfallen. Gemessen war
			 * sie bei 420×380 einmal 45 Pixel hoch bei 284 Pixeln Inhalt — ein
			 * Fenster auf einen einzigen Eintrag.
			 *
			 * Gezählt werden nur Städte, nicht der Eintrag "ohne Vergleich": bei
			 * 470×470 war genau er der einzige sichtbare, und ein Kasten, in dem
			 * nichts als "ohne Vergleich" steht, sagt das Gegenteil von dem, was
			 * er soll. Die frühere Fassung dieser Prüfung maß seine Höhe als
			 * Zeilenhöhe und blieb deshalb grün. */
			var cul = doc.querySelector('#map-compare ul');
			var staedte = cul ? cul.querySelectorAll('li:not(.no-compare)') : [];
			if (staedte.length) {
				var sichtbareStaedte = 0;
				var cr = rect(cul);
				Array.prototype.forEach.call(staedte, function (li) {
					var r = rect(li);
					if (r.t >= cr.t - 1 && r.b <= cr.b + 1) sichtbareStaedte++;
				});
				check(tag + ' | Städteliste zeigt mindestens zwei Städte',
					sichtbareStaedte >= 2,
					sichtbareStaedte + ' von ' + staedte.length + ' Städten sichtbar, ' +
					'Liste ' + Math.round(cr.h) + ' px bei ' + cul.scrollHeight + ' px Inhalt');
			}
		}
	}

	/* 12b. Die Hinweiszeile nennt, wie viele Einträge außerhalb liegen. Die
	 *      Abblende sagt nur, DASS es weitergeht; bei fünf Bränden ist der
	 *      Unterschied zwischen "da fehlt noch was" und "da fehlen zwei" die
	 *      ganze Auskunft. Geprüft werden beide Listen — die Städteliste ist die,
	 *      die als erste zu kurz wird — und beide Richtungen: eine Zeile, die
	 *      eine falsche Zahl nennt, ist schlechter als keine. */
	if (listenAn) {
		['#map-fires', '#map-compare'].forEach(function (sel) {
			var kasten = doc.querySelector(sel);
			var liste = kasten ? kasten.querySelector('ul') : null;
			if (!visible(kasten) || !liste) return;
			var lr = rect(liste);
			var aussen = 0;
			Array.prototype.forEach.call(liste.querySelectorAll('li'), function (li) {
				var r = rect(li);
				if (r.t < lr.t - 1 || r.b > lr.b + 1) aussen++;
			});
			var zeile = kasten.querySelector('.list-hint');
			if (!aussen) {
				/* Geprüft wird der Text, nicht die Sichtbarkeit. Der Mutationslauf
				 * hat gezeigt, dass eine Prüfung auf "unsichtbar" hier nicht
				 * beißen kann: die Zeile ist absolut positioniert und ohne Text
				 * null Pixel breit, also nach jedem Maß unsichtbar — auch dann,
				 * wenn das Stylesheet sie fälschlich einblendet. Falsch wäre eine
				 * Auskunft über Einträge, die es nicht gibt; genau die steht im
				 * Text. */
				check(tag + ' | ' + sel + ' ohne verdeckte Einträge ohne Hinweis',
					!zeile || zeile.textContent.trim() === '',
					zeile ? 'Zeile sagt "' + zeile.textContent.trim() + '"' : '');
				return;
			}
			check(tag + ' | ' + sel + ' Hinweiszeile sichtbar', visible(zeile),
				aussen + ' außerhalb, aber keine Zeile');
			if (visible(zeile)) {
				var genannt = (zeile.textContent.match(/\d+/g) || [])
					.reduce(function (a, b) { return a + Number(b); }, 0);
				check(tag + ' | ' + sel + ' Hinweiszeile nennt die Zahl',
					genannt === aussen,
					'Zeile "' + zeile.textContent.trim() + '" nennt ' + genannt +
					', außerhalb sind ' + aussen);
			}
		});
	}

	/* 12c. Die kompakte Zustandsanzeige. Unterhalb der Schwelle im Stylesheet
	 *      teilen Flächenzahl und Datum eine Zeile, der Zeitstrahl liegt darunter,
	 *      und die Nebenangaben stehen hinter einem Aufklapper. Oberhalb der
	 *      Schwelle darf nichts davon greifen — sonst wäre die Auskunft auch dort
	 *      weggeklappt, wo Platz für sie ist. */
	var karte = doc.getElementById('map-controls');
	var aufklapper = doc.getElementById('fire-details');
	var griff = doc.getElementById('fire-details-label');
	var beschriftung = doc.getElementById('fire-caption');
	var kompakt = win.getComputedStyle(karte).getPropertyValue('--compact').trim() === '1';
	var eineZeile = win.getComputedStyle(karte).getPropertyValue('--compact-row').trim() === '1';

	check(tag + ' | Aufklapper vorhanden', !!aufklapper && !!griff && !!beschriftung);

	/* Zahl und Datum in einer Zeile hängt an der Rahmenhöhe, der Aufklapper auch
	 * an der Breite: die ausgeschriebene Flächenangabe braucht neben einem Datum
	 * mehr Platz, als ein 360 Pixel breiter Rahmen dem Kasten lässt. Deshalb zwei
	 * Schalter und nicht einer. */
	if (eineZeile) {
		var zahl = rect(doc.getElementById('map-size'));
		var datum = rect(doc.getElementById('map-date'));
		var strahl = rect(doc.getElementById('map-timeline'));

		/* Eine Zeile heißt: sie überlappen senkrecht und stehen nebeneinander. */
		check(tag + ' | Zahl und Datum in einer Zeile',
			datum.l >= zahl.r - 1 && datum.t < zahl.b - 1 && datum.b > zahl.t + 1,
			'Zahl ' + Math.round(zahl.l) + '–' + Math.round(zahl.r) + ' × ' +
			Math.round(zahl.t) + '–' + Math.round(zahl.b) + ', Datum ' +
			Math.round(datum.l) + '–' + Math.round(datum.r) + ' × ' +
			Math.round(datum.t) + '–' + Math.round(datum.b));

		check(tag + ' | Zeitstrahl unter Zahl und Datum',
			strahl.t >= Math.max(zahl.b, datum.b) - 1,
			'Zeitstrahl oben ' + Math.round(strahl.t) + ', Zeile endet ' +
			Math.round(Math.max(zahl.b, datum.b)));

		/* Und er nutzt die ganze Breite des Kastens. Fällt er auf die erste
		 * Rasterspalte zurück, verliert er ein Drittel seiner Länge — die Achse
		 * ist dann kürzer, ohne dass irgendwo etwas überlappt oder abgeschnitten
		 * wäre. Genau das blieb unentdeckt, bis der Mutationslauf danach fragte. */
		check(tag + ' | Zeitstrahl nutzt die ganze Breite',
			strahl.r >= Math.max(zahl.r, datum.r) - 1,
			'Zeitstrahl rechts ' + Math.round(strahl.r) + ', Zeile reicht bis ' +
			Math.round(Math.max(zahl.r, datum.r)));
	}

	/* Gemessen wird die Höhe, nicht die Sichtbarkeit der Beschriftung. Chrome 150
	 * blendet den Inhalt eines geschlossenen <details> über content-visibility aus
	 * und liefert für die Kinder darin weiterhin ein Rechteck — eine Prüfung auf
	 * "unsichtbar" wäre also rot geblieben, obwohl der Kasten korrekt
	 * zusammengeklappt war (gemessen: details 240×22, also nur der Griff, während
	 * die Beschriftung 240×81 unterhalb des Kastens meldete). Der Kasten selbst
	 * lügt nicht: zugeklappt ist er so hoch wie sein Griff. */
	if (aufklapper && griff && beschriftung) {
		if (kompakt) {
			var zu = rect(aufklapper);
			var kastenZu = rect(karte).h;
			check(tag + ' | Nebenangaben sind zugeklappt',
				!aufklapper.open && zu.h <= rect(griff).h + 6,
				'open=' + aufklapper.open + ', Aufklapper ' + Math.round(zu.h) +
				' px hoch bei Griff ' + Math.round(rect(griff).h) + ' px');

			check(tag + ' | Aufklapper ist sichtbar und beschriftet',
				visible(griff) && griff.textContent.trim().length > 0,
				'sichtbar ' + visible(griff) + ', Text "' + griff.textContent.trim() + '"');

			/* Zugeklappt genügt nicht — es muss sich auch öffnen lassen, sonst
			 * wäre die Auskunft schlicht weg. Und die Beschriftung muss danach
			 * innerhalb des Aufklappers liegen, nicht irgendwo. */

			/* Vor dem Klick: nimmt der Griff überhaupt Zeigerereignisse an? Ein
			 * Klick aus dem Skript feuert auch bei pointer-events: none — die
			 * Prüfung darunter blieb deshalb grün, während der Griff für einen
			 * Menschen unbedienbar war. Vom Mutationslauf aufgedeckt. */
			check(tag + ' | Aufklapp-Griff nimmt Zeigerereignisse an',
				win.getComputedStyle(griff).pointerEvents !== 'none',
				'pointer-events: ' + win.getComputedStyle(griff).pointerEvents);

			griff.click();
			var auf = rect(aufklapper);
			var cap = rect(beschriftung);
			check(tag + ' | Aufklappen zeigt die Nebenangaben',
				aufklapper.open && auf.h > zu.h + 10 &&
				cap.t >= auf.t - 1 && cap.b <= auf.b + 1,
				'open=' + aufklapper.open + ', Aufklapper ' + Math.round(zu.h) +
				' → ' + Math.round(auf.h) + ' px, Beschriftung ' +
				Math.round(cap.t) + '–' + Math.round(cap.b) + ' in ' +
				Math.round(auf.t) + '–' + Math.round(auf.b));

			/* Der Sinn der Sache: zugeklappt ist der Kasten kürzer. Ohne diese
			 * Prüfung könnte der Aufklapper korrekt schalten, ohne Höhe zu
			 * sparen — dann wäre er nur ein weiteres Bedienelement. */
			check(tag + ' | zugeklappt ist der Kasten kürzer',
				rect(karte).h >= kastenZu + 20,
				'zugeklappt ' + Math.round(kastenZu) + ' px, offen ' +
				Math.round(rect(karte).h) + ' px');
			griff.click();
		} else {
			var offen = rect(aufklapper);
			var capOffen = rect(beschriftung);
			check(tag + ' | Nebenangaben stehen offen da',
				aufklapper.open && capOffen.h > 0 &&
				capOffen.t >= offen.t - 1 && capOffen.b <= offen.b + 1,
				'open=' + aufklapper.open + ', Beschriftung ' +
				Math.round(capOffen.t) + '–' + Math.round(capOffen.b) + ' in ' +
				Math.round(offen.t) + '–' + Math.round(offen.b));
			check(tag + ' | kein Aufklapp-Griff, wo Platz ist', !visible(griff));
		}
	}

	/* 13. Im Rahmen ist die Kopfzeile ausgeblendet — das ist gewollt, macht aber
	 *     Prüfung 6 zur Pflicht. */
	check(tag + ' | Rahmen erkannt', doc.documentElement.classList.contains('in-frame'));

	/* 14. Der Städtevergleich ist beschriftet. Steht am Ende, weil ein Vergleich
	 *     den Kartenausschnitt nachzieht und damit die Messungen davor
	 *     verfälschen würde.
	 *
	 *     Ohne Beschriftung sagt der Umriss nicht, welche Stadt er zeigt: in der
	 *     kompakten Darstellung steht die Antwort im zugeklappten Auswahlfeld,
	 *     und in einem weitergegebenen Bildschirmfoto nirgends. */

	/* Zuerst der Zustand beim Laden — ohne Zutun. Der Größenvergleich ist die
	 * Aussage dieser Anwendung; stand er im Standard aus, war sie in jeder
	 * Einbettung unsichtbar, die keinen Anker mit Stadt trägt. Geprüft wird gegen
	 * das Feld compare in den Daten, nicht gegen einen im Test wiederholten
	 * Namen: sonst prüfte der Test seine eigene Erwartung. */
	var aktiverBrand = (doc.querySelector('#map-fires a.highlight') || {}).getAttribute
		? doc.querySelector('#map-fires a.highlight').getAttribute('data-fire')
		: null;
	var brandDaten = (win._fires || []).filter(function (f) { return f.slug === aktiverBrand; })[0];
	var stadtDaten = brandDaten
		? (win._cities || []).filter(function (c) { return c.slug === brandDaten.compare; })[0]
		: null;
	check(tag + ' | Brand nennt eine voreingestellte Vergleichsstadt',
		!!stadtDaten, 'Brand ' + aktiverBrand + ', compare ' +
		(brandDaten ? brandDaten.compare : '—'));
	if (stadtDaten) {
		var start = doc.querySelector('.city-label span');
		var erwartet = stadtDaten.label[page.indexOf('-en') !== -1 ? 'en' : 'de'] || stadtDaten.label.de;
		check(tag + ' | Vergleich ist beim Laden eingeblendet',
			!!start && start.textContent.trim() === erwartet,
			start ? 'Marke "' + start.textContent + '" statt "' + erwartet + '"' : 'keine Marke');
		check(tag + ' | voreingestellter Eintrag ist hervorgehoben',
			(doc.querySelector('#map-compare a.highlight') || {}).getAttribute &&
			doc.querySelector('#map-compare a.highlight').getAttribute('data-city') === stadtDaten.slug,
			'hervorgehoben: ' + ((doc.querySelector('#map-compare a.highlight') || {}).getAttribute
				? doc.querySelector('#map-compare a.highlight').getAttribute('data-city') : 'keiner'));
	}

	/* Dann ein Wechsel auf eine ANDERE Stadt. Der erste Eintrag der Liste taugt
	 * dafür nicht mehr: ist er der voreingestellte, hebt ein Klick den Vergleich
	 * auf, statt ihn zu setzen — genau das hat diese Prüfung gemeldet, als die
	 * Voreinstellung dazukam. */
	var aktivJetzt = (doc.querySelector('#map-compare a.highlight') || {}).getAttribute
		? doc.querySelector('#map-compare a.highlight').getAttribute('data-city')
		: '';
	var stadtFeldEl = doc.getElementById('pick-city');
	var stadtName = '';
	if (felderAn && stadtFeldEl && stadtFeldEl.options.length > 1) {
		var andere = null;
		for (var oi = 1; oi < stadtFeldEl.options.length; oi++) {
			if (stadtFeldEl.options[oi].value !== aktivJetzt) { andere = stadtFeldEl.options[oi]; break; }
		}
		if (andere) {
			stadtFeldEl.value = andere.value;
			stadtName = andere.textContent;
			stadtFeldEl.dispatchEvent(new win.Event('change', { bubbles: true }));
		}
	} else {
		var links = doc.querySelectorAll('#map-compare a[data-city]:not([data-city=""])');
		for (var li = 0; li < links.length; li++) {
			if (links[li].getAttribute('data-city') !== aktivJetzt) {
				stadtName = links[li].textContent;
				links[li].click();
				break;
			}
		}
	}

	check(tag + ' | Städtevergleich auswählbar', stadtName.length > 0);

	if (stadtName) {
		var marke = doc.querySelector('.city-label span');
		check(tag + ' | Stadtumriss ist beschriftet',
			!!marke && marke.textContent.trim() === stadtName.trim(),
			marke ? 'Marke "' + marke.textContent + '" statt "' + stadtName + '"' : 'keine Marke');
		if (marke) {
			var mr = rect(marke);
			check(tag + ' | Beschriftung im Sichtbereich',
				mr.l >= -1 && mr.t >= -1 && mr.r <= view.r + 1 && mr.b <= view.b + 1,
				'links ' + Math.round(mr.l) + ' oben ' + Math.round(mr.t) +
				' rechts ' + Math.round(mr.r) + ' unten ' + Math.round(mr.b));
		}

		/* Die weiße Füllung darf die Brandfläche nicht ausbleichen — sie lag
		 * vorher bei 0,35 Deckkraft genau über der Aussage des Vergleichs. */
		var umriss = doc.querySelector('.leaflet-overlay-pane path[fill="#FFFFFF"]');
		if (umriss) {
			var deck = parseFloat(umriss.getAttribute('fill-opacity'));
			check(tag + ' | Stadtumriss deckt die Brandfläche nicht ab', deck <= 0.15,
				'Deckkraft ' + deck);
		}

		/* Und es muss einen Weg zurück geben, der nicht erraten werden muss.
		 * Vorhanden genügt nicht — im Auswahlfeld reicht der Eintrag, in der
		 * Liste muss er auch zu sehen sein. */
		if (felderAn) {
			check(tag + ' | Weg zurück ohne Vergleich vorhanden',
				!!doc.querySelector('#pick-city option[value=""]'));
		} else {
			var zurueck = doc.querySelector('#map-compare li.no-compare');
			check(tag + ' | Weg zurück ohne Vergleich sichtbar', visible(zurueck),
				zurueck ? 'Eintrag vorhanden, aber nicht sichtbar' : 'kein Eintrag');
		}
	}
}

function run() {
	var host = document.getElementById('frames');
	var jobs = [];

	PAGES.forEach(function (page) {
		VIEWPORTS.forEach(function (vp) {
			var f = document.createElement('iframe');
			if (vp.lateSize) {
				/* Erst ohne Maße einhängen, dann verzögert bemaßen. */
				f.width = 0;
				f.height = 0;
				f.style.width = '0px';
				f.style.height = '0px';
			} else {
				f.width = vp.w;
				f.height = vp.h;
			}
			f.src = page;
			host.appendChild(f);
			if (vp.lateSize) {
				setTimeout(function () {
					f.width = vp.w;
					f.height = vp.h;
					f.style.width = vp.w + 'px';
					f.style.height = vp.h + 'px';
				}, 1200);
			}
			jobs.push({ page: page, vp: vp, frame: f });
		});
	});

	/* Reichlich Zeit: die Anwendung setzt den Kartenausschnitt, startet die
	 * Animation und Leaflet baut seine Bedienelemente erst danach auf. */
	setTimeout(function () {
		jobs.forEach(function (job) {
			try {
				testFrame(job.page, job.vp, job.frame.contentWindow, job.frame.contentDocument);
			} catch (err) {
				check(job.page + ' @ ' + job.vp.name + ' | Prüfung durchgelaufen', false, String(err));
			}
		});

		lines.push('DONE ' + pass + ' bestanden, ' + fail + ' fehlgeschlagen');
		document.getElementById('results').textContent = lines.join('\n');
		document.title = fail ? 'FEHLGESCHLAGEN' : 'BESTANDEN';
	}, 6000);
}

run();
</script>
</body>
</html>
