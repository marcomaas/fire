<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<title>Routing- und Auswahl-Tests</title>
	<meta name="robots" content="noindex">
	<style>
		body { font-family: ui-monospace, Menlo, monospace; font-size: 13px; margin: 12px; background: #fff; color: #000; }
		#frames { position: absolute; left: -20000px; top: 0; }
		#frames iframe { border: 0; display: block; }
		pre { white-space: pre-wrap; }
	</style>
</head>
<body>
<h1>Routing- und Auswahl-Tests</h1>
<pre id="results">läuft …</pre>
<div id="frames"></div>

<script>
/*
 * Prüft, was die Adresse mit der Anwendung macht — nicht wie sie aussieht.
 *
 * Diese Prüfungen gehören nicht in layout.test.html: dort geht es um Geometrie
 * bei verschiedenen Rahmengrößen, hier um Verhalten bei verschiedenen Adressen.
 * Beides in einer Datei hieße, jede Adresse in zehn Rahmen zu laden.
 *
 * Anlass: mit ?nur= kann eine Redaktion je Einbettung festlegen, welche Brände
 * zu sehen sind. Damit hängt an der Adresse eine inhaltliche Aussage — ein
 * stiller Fehler zeigt dann in einem fremden Artikel Brände, die dort nicht
 * stehen sollen. Genau ein solcher Fehler steckte in index.html: die
 * Weiterleitung nahm den Anker mit, die Query nicht.
 */

var lines = [];
var pass = 0;
var fail = 0;

function check(label, ok, detail) {
	if (ok) { pass++; lines.push('PASS ' + label); }
	else { fail++; lines.push('FAIL ' + label + (detail ? ' — ' + detail : '')); }
	document.getElementById('results').textContent = lines.join('\n');
}

/* Legt zwei halbdurchsichtige Farben übereinander, so wie der Browser es tut. */
function ueber(oben, deckkraft, unten) {
	return oben.map(function (c, i) {
		return c * deckkraft + unten[i] * (1 - deckkraft);
	});
}

function hex(farbe) {
	return '#' + farbe.map(function (c) {
		var h = Math.round(c).toString(16);
		return h.length < 2 ? '0' + h : h;
	}).join('');
}

/* Wie farbig bleibt die Brandfläche, wenn der Stadtumriss darüber liegt?
 *
 * Kartengrund als heller Reliefton angenommen (#DDD8CE, gemessen an den
 * Esri-Kacheln der Anwendung). Die Annahme steht hier und nicht verborgen im
 * Vergleichswert: ein dunklerer Grund ergäbe eine höhere Sättigung, die Prüfung
 * rechnet also mit dem ungünstigsten der vorkommenden Fälle. */
function farben(doc) {
	var GRUND = [221, 216, 206];
	var lies = function (pfad) {
		if (!pfad) return null;
		var f = pfad.getAttribute('fill');
		var m = /^#(..)(..)(..)$/.exec(f || '');
		if (!m) return null;
		return {
			rgb: [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)],
			deckkraft: parseFloat(pfad.getAttribute('fill-opacity') || '1')
		};
	};
	var brand = lies(doc.querySelector('.leaflet-overlay-pane path[fill="#BE1313"]'));
	var stadt = lies(doc.querySelector('.leaflet-overlay-pane path[fill="#FFFFFF"]'));
	if (!brand || !stadt) {
		return { brand: brand, stadt: stadt, saettigung: 0, ergebnis: '', stadtDeckkraft: stadt ? stadt.deckkraft : null };
	}
	var mitBrand = ueber(brand.rgb, brand.deckkraft, GRUND);
	var mitStadt = ueber(stadt.rgb, stadt.deckkraft, mitBrand);
	var max = Math.max.apply(null, mitStadt);
	var min = Math.min.apply(null, mitStadt);
	return {
		brand: brand,
		stadt: stadt,
		stadtDeckkraft: stadt.deckkraft,
		saettigung: max > 0 ? (max - min) / max : 0,
		ergebnis: hex(mitStadt)
	};
}

/* Liest den Zustand einer geladenen Fassung aus. Bewusst über das erzeugte
 * Dokument statt über innere Variablen: geprüft wird, was ein Leser sieht. */
function zustand(doc, win) {
	var listen = [];
	doc.querySelectorAll('#map-fires a[data-fire]').forEach(function (a) {
		listen.push(a.getAttribute('data-fire'));
	});
	var felder = [];
	var sel = doc.getElementById('pick-fire');
	if (sel) {
		for (var i = 0; i < sel.options.length; i++) felder.push(sel.options[i].value);
	}
	var aktiv = doc.querySelector('#map-fires a.highlight');
	return {
		liste: listen,
		feld: felder,
		aktiv: aktiv ? aktiv.getAttribute('data-fire') : null,
		stadt: (doc.querySelector('#map-compare a.highlight') || {}).getAttribute
			? doc.querySelector('#map-compare a.highlight').getAttribute('data-city')
			: null,
		anzahl: (doc.getElementById('info-count') || {}).textContent || '',
		datum: (doc.getElementById('map-date') || {}).textContent || '',
		daten: win._fires || null,
		sprachLink: (function () {
			var a = doc.querySelector("#nav a[href*='index-']");
			if (!a) return null;
			/* Klick auslösen, ohne zu navigieren: der Handler setzt das href, das
			 * Vorgabeverhalten wird verhindert. */
			var ev = new win.MouseEvent('click', { bubbles: true, cancelable: true });
			a.addEventListener('click', function (e) { e.preventDefault(); }, { once: true });
			a.dispatchEvent(ev);
			return a.getAttribute('href');
		})(),
		marke: (doc.querySelector('.city-label span') || {}).textContent || '',
		farben: farben(doc),
		adresse: win.location.search + win.location.hash,
		vollLink: (function () {
			var a = doc.querySelector('.leaflet-control-attribution a[href*="apps.datenfreunde.com"]');
			return a ? a.getAttribute('href') : null;
		})()
	};
}

function lade(url, cb) {
	var f = document.createElement('iframe');
	f.width = 900;
	f.height = 600;
	f.src = url;
	f.onload = function () {
		/* Wartezeit, bis Daten geladen und die Auswahl aufgebaut ist. Die Karte
		 * selbst muss dafür nicht fertig sein. */
		setTimeout(function () {
			var z = null;
			try {
				z = zustand(f.contentDocument, f.contentWindow);
			} catch (e) {
				z = { fehler: String(e) };
			}
			f.remove();
			cb(z);
		}, 900);
	};
	document.getElementById('frames').appendChild(f);
}

/* Wartet, bis eine Bedingung im Rahmen zutrifft. Nötig für alles, was von der
 * abgespielten Zeitleiste abhängt: die Anwendung startet die Animation selbst,
 * und eine feste Wartezeit trifft dann einen zufälligen Zwischenstand. */
function warteAuf(doc, bedingung, cb, versuche) {
	versuche = versuche === undefined ? 120 : versuche;
	if (bedingung()) { cb(true); return; }
	if (versuche <= 0) { cb(false); return; }
	setTimeout(function () { warteAuf(doc, bedingung, cb, versuche - 1); }, 100);
}

var ALLE = ['gironde', 'central-spain', 'biscarrosse', 'artana', 'fontainebleau'];

var FAELLE = [
	{
		name: 'ohne Angabe: alle Brände',
		url: '../app/index-de.html',
		pruefe: function (z) {
			check('ohne Angabe | Liste zeigt alle Brände',
				z.liste.length === ALLE.length, z.liste.join(','));
			check('ohne Angabe | erster Brand ist aktiv',
				z.aktiv === ALLE[0], 'aktiv ' + z.aktiv);
			/* Ohne Angabe gilt die Voreinstellung aus den Daten. Erwartet wird das
			 * Feld compare des aktiven Brandes, kein im Test wiederholtes Kürzel:
			 * ändert sich die Städteliste, soll diese Prüfung der Änderung folgen
			 * und nicht an einem festgeschriebenen Namen scheitern. */
			var brand = (z.daten || []).filter(function (f) { return f.slug === z.aktiv; })[0];
			check('ohne Angabe | Brand nennt eine Vergleichsstadt',
				!!brand && !!brand.compare, 'compare ' + (brand ? brand.compare : '—'));
			check('ohne Angabe | Standardvergleich ist eingeblendet',
				!!brand && z.stadt === brand.compare,
				'Stadt ' + JSON.stringify(z.stadt) + ', erwartet ' + (brand ? brand.compare : '—'));
			check('ohne Angabe | Anker nennt die eingeblendete Stadt',
				!!brand && z.adresse.indexOf('#' + z.aktiv + '/' + brand.compare) !== -1,
				'Adresse ' + z.adresse);
		}
	},
	{
		name: 'Anker öffnet einen Brand',
		url: '../app/index-de.html#artana',
		pruefe: function (z) {
			check('Anker | öffnet den genannten Brand', z.aktiv === 'artana', 'aktiv ' + z.aktiv);
		}
	},
	{
		name: 'Anker mit Stadt',
		url: '../app/index-de.html#fontainebleau/paris',
		pruefe: function (z) {
			check('Anker mit Stadt | Brand stimmt', z.aktiv === 'fontainebleau', 'aktiv ' + z.aktiv);
			check('Anker mit Stadt | Stadt ist eingeblendet', z.stadt === 'paris', 'Stadt ' + z.stadt);
		}
	},
	{
		name: 'Voreinstellung folgt dem Brand',
		url: '../app/index-de.html#fontainebleau',
		pruefe: function (z) {
			var brand = (z.daten || []).filter(function (f) { return f.slug === 'fontainebleau'; })[0];
			check('Voreinstellung | anderer Brand, andere Stadt',
				!!brand && z.stadt === brand.compare && brand.compare !== 'bordeaux',
				'Stadt ' + z.stadt + ', compare ' + (brand ? brand.compare : '—'));
		}
	},
	{
		name: 'ausdrücklich ohne Vergleich',
		url: '../app/index-de.html#gironde/none',
		pruefe: function (z) {
			/* Das Gegenstück zur Voreinstellung: eine Redaktion, die im Konfigurator
			 * "ohne Vergleich" wählt, bekommt diesen Anker. Bliebe er wirkungslos,
			 * zeigte die Einbettung etwas anderes als bestellt. */
			check('ohne Vergleich | Brand stimmt', z.aktiv === 'gironde', 'aktiv ' + z.aktiv);
			check('ohne Vergleich | keine Stadt eingeblendet',
				z.stadt === '' || z.stadt === null, 'Stadt ' + JSON.stringify(z.stadt));
			check('ohne Vergleich | keine Beschriftung auf der Karte',
				!z.marke, 'Marke "' + z.marke + '"');
			check('ohne Vergleich | Anker bleibt erhalten',
				z.adresse.indexOf('#gironde/none') !== -1, 'Adresse ' + z.adresse);
		}
	},
	{
		name: 'Vergleichsstadt bleibt Signalfarbe',
		url: '../app/index-de.html#gironde/london',
		pruefe: function (z) {
			/* Befund 5 des Sprints: die weiße Füllung des Stadtumrisses wusch die
			 * Brandfläche aus — bei der größten Stadt über dem kleineren Brand
			 * erschien das ganze Gebiet blassrosa statt signalrot.
			 *
			 * Gerechnet statt geschaut: die Prüfung liest die tatsächlichen
			 * Zeichenangaben aus dem Dokument und legt die Farben übereinander wie
			 * der Browser es tut — Brandfläche über hellem Kartengrund, Stadtumriss
			 * darüber. Ein Bildvergleich bräuchte ein Bildschirmfoto und wäre gegen
			 * jede Kachel-Änderung empfindlich; die Deckkraft allein wiederum sagt
			 * nichts darüber, was dabei herauskommt. */
			check('Signalfarbe | Brandfläche gezeichnet', !!z.farben.brand,
				'keine rote Fläche gefunden');
			check('Signalfarbe | Stadtumriss gezeichnet', !!z.farben.stadt,
				'keine weiße Fläche gefunden');
			if (z.farben.brand && z.farben.stadt) {
				check('Signalfarbe | Rot bleibt gesättigt unter dem Umriss',
					z.farben.saettigung >= 0.5,
					'Sättigung ' + z.farben.saettigung.toFixed(2) + ' bei Deckkraft ' +
					z.farben.stadtDeckkraft + ' — ergibt ' + z.farben.ergebnis);
			}
		}
	},
	{
		name: 'unbekannter Anker',
		url: '../app/index-de.html#gibtsnicht',
		pruefe: function (z) {
			/* Ein Tippfehler oder ein später entfernter Brand darf keine leere
			 * Karte ergeben. */
			check('unbekannter Anker | fällt auf den ersten Brand zurück',
				z.aktiv === ALLE[0], 'aktiv ' + z.aktiv);
		}
	},
	{
		name: 'Auswahl über ?nur=',
		url: '../app/index-de.html?nur=gironde,artana',
		pruefe: function (z) {
			check('?nur= | Liste zeigt nur die genannten Brände',
				z.liste.join(',') === 'gironde,artana', z.liste.join(','));
			check('?nur= | Auswahlfeld zeigt dieselben',
				z.feld.join(',') === 'gironde,artana', z.feld.join(','));
			check('?nur= | Zahl im Info-Kasten stimmt',
				z.anzahl === 'zwei', 'Zahl "' + z.anzahl + '"');
		}
	},
	{
		name: 'Reihenfolge kommt aus den Daten',
		url: '../app/index-de.html?nur=artana,gironde',
		pruefe: function (z) {
			/* Eine vertippte Reihenfolge in der Adresse soll die Anwendung nicht
			 * umsortieren — sonst sieht dieselbe Auswahl je nach Schreibweise
			 * anders aus. */
			check('Reihenfolge | folgt den Daten, nicht der Adresse',
				z.liste.join(',') === 'gironde,artana', z.liste.join(','));
		}
	},
	{
		name: 'Leerzeichen und Groß-/Kleinschreibung',
		url: '../app/index-de.html?nur=%20Gironde%20,%20ARTANA%20',
		pruefe: function (z) {
			check('Schreibweise | Leerzeichen und Großbuchstaben werden verkraftet',
				z.liste.join(',') === 'gironde,artana', z.liste.join(','));
		}
	},
	{
		name: 'Anker außerhalb der Auswahl',
		/* Die Auswahl beginnt bewusst NICHT mit dem ersten Brand der Daten, und der
		 * Anker zeigt bewusst auf genau diesen ersten Brand. Sonst prüft der Fall
		 * nichts: fiele der Rückfall fälschlich auf _fires[0] statt auf den ersten
		 * Brand der Auswahl, käme bei ?nur=gironde,… beides Mal gironde heraus. Der
		 * Mutationslauf hat genau das nachgewiesen — mit gironde an erster Stelle
		 * blieb die Prüfung grün, obwohl der Rückfall die Auswahl ignorierte. */
		url: '../app/index-de.html?nur=artana,fontainebleau#gironde',
		pruefe: function (z) {
			/* Das ist die inhaltlich wichtigste Prüfung: ein Anker darf die
			 * festgelegte Auswahl nicht aushebeln. Sonst zeigte die Einbettung
			 * genau den Brand, den sie nicht zeigen soll. */
			/* Auf ein vorhandenes aktives Element bestehen, nicht nur auf ein
			 * anderes: ohne den ersten Teil bestünde die Prüfung auch dann, wenn
			 * überhaupt kein Brand hervorgehoben ist. Genau das trat bei der
			 * Mutation ein — der Rückfall wählte einen Brand außerhalb der Liste,
			 * es gab kein Element dafür, und die Prüfung blieb grün. */
			check('Anker außerhalb | öffnet ihn nicht',
				z.aktiv !== null && z.aktiv !== 'gironde', 'aktiv ' + z.aktiv);
			check('Anker außerhalb | fällt in die Auswahl zurück',
				z.liste.indexOf(z.aktiv) !== -1, 'aktiv ' + z.aktiv + ' nicht in ' + z.liste.join(','));
			check('Anker außerhalb | nimmt den ersten Brand der Auswahl',
				z.aktiv === 'artana', 'aktiv ' + z.aktiv);
		}
	},
	{
		name: 'nur unbekannte Kürzel',
		url: '../app/index-de.html?nur=paris,london',
		pruefe: function (z) {
			/* Bleibt von der Auswahl nichts übrig, ist alles zeigen besser als
			 * eine leere Karte in einem fremden Artikel. */
			check('nur Unbekanntes | fällt auf alle Brände zurück',
				z.liste.length === ALLE.length, z.liste.join(','));
		}
	},
	{
		name: 'leere Angabe',
		url: '../app/index-de.html?nur=',
		pruefe: function (z) {
			check('leere Angabe | zeigt alle Brände',
				z.liste.length === ALLE.length, z.liste.join(','));
		}
	},
	{
		name: 'Auswahl übersteht das Schreiben des Ankers',
		/* Ohne Anker in der Adresse — und das ist der Punkt: nur dann schreibt die
		 * Anwendung den Anker selbst, und nur dann kann sie dabei die Auswahl
		 * verlieren. Mit #artana in der Adresse und artana als erstem Brand der
		 * Auswahl stimmte der Anker bereits, das Schreiben entfiel, und der Fall
		 * prüfte die Zeile nie, die er prüfen sollte. Auch das hat erst der
		 * Mutationslauf gezeigt. */
		url: '../app/index-de.html?nur=gironde,artana',
		pruefe: function (z) {
			check('Brandwechsel | Anker wird geschrieben',
				z.adresse.indexOf('#gironde') !== -1, 'Adresse ' + z.adresse);
			check('Brandwechsel | Adresse behält die Auswahl',
				z.adresse.indexOf('nur=') !== -1, 'Adresse ' + z.adresse);
		}
	},
	{
		name: 'Verweis auf die vollständige Anwendung',
		url: '../app/index-de.html?nur=gironde#gironde',
		pruefe: function (z) {
			check('Rahmen | Verweis auf die vollständige Anwendung vorhanden',
				!!z.vollLink, 'kein Verweis in der Herkunftszeile');
			if (z.vollLink) {
				check('Rahmen | Verweis nimmt den Anker mit',
					z.vollLink.indexOf('#gironde') !== -1, z.vollLink);
				/* Ohne Filter: in der vollen Anwendung soll der Leser die Auswahl
				 * selbst steuern können. */
				check('Rahmen | Verweis nimmt die Auswahl nicht mit',
					z.vollLink.indexOf('nur=') === -1, z.vollLink);
			}
		}
	},
	{
		name: 'Einstiegsseite gibt Anker und Auswahl weiter',
		url: '../app/index.html?nur=gironde,artana#artana',
		pruefe: function (z) {
			check('Einstiegsseite | Auswahl kommt an',
				z.liste.join(',') === 'gironde,artana', z.liste.join(','));
			check('Einstiegsseite | Anker kommt an', z.aktiv === 'artana', 'aktiv ' + z.aktiv);
		}
	},
	{
		name: 'Zeitangabe in der Ortszeit des Brandes',
		url: '../app/index-de.html#artana',
		/* Eigenes Laden: geprüft wird der Stand NACH der Animation, nicht ein
		 * Zwischenstand. Die Anwendung spielt beim Öffnen selbst ab, eine feste
		 * Wartezeit träfe deshalb eine interpolierte Zeit — und gegen die lässt sich
		 * nichts vergleichen. */
		eigenesLaden: function (fertig) {
			var f = document.createElement('iframe');
			f.width = 900;
			f.height = 600;
			f.src = '../app/index-de.html#artana';
			f.onload = function () {
				var doc = f.contentDocument, win = f.contentWindow;
				warteAuf(doc, function () {
					return doc.getElementById('map-container') &&
						doc.getElementById('map-container').classList.contains('played');
				}, function (durch) {
					var datum = (doc.getElementById('map-date') || {}).textContent || '';
					var daten = win._fires || [];
					f.remove();

					check('Zeitangabe | Animation läuft durch', durch,
						'Animation nicht fertig — Anzeige "' + datum + '"');
					if (!durch) { fertig(); return; }

					check('Zeitangabe | nennt Datum, Uhrzeit und Kürzel',
						/\d{2}\.\d{2}\.\d{4}\s+\d{2}:\d{2}\s+(MEZ|MESZ)$/.test(datum.trim()),
						'Anzeige "' + datum + '"');

					var brand = daten.filter(function (x) { return x.slug === 'artana'; })[0];
					check('Zeitangabe | Rohdaten des Brandes vorhanden', !!brand);
					if (!brand) { fertig(); return; }

					/* Nach der Animation steht der letzte Zeitschnitt. Die Erwartung
					 * entsteht über Intl aus den Rohdaten — ein zweiter Rechenweg, nicht
					 * derselbe noch einmal. Eine reine Formprüfung besteht auch bei
					 * falschem Versatz; der Mutationslauf hat genau das gezeigt. */
					var letzter = brand.steps[brand.steps.length - 1];
					var ms = Date.parse(letzter.acquired + 'Z');
					var erwartet = new Intl.DateTimeFormat('de-DE', {
						timeZone: brand.timezone,
						day: '2-digit', month: '2-digit', year: 'numeric',
						hour: '2-digit', minute: '2-digit'
					}).format(ms);
					var ziffern = function (t) { return t.replace(/\D/g, ''); };

					check('Zeitangabe | stimmt mit der Ortszeit der Aufnahme überein',
						ziffern(datum) === ziffern(erwartet),
						'angezeigt "' + datum.trim() + '", erwartet "' + erwartet +
						'" (' + brand.timezone + ')');

					var versatz = Math.round(
						(new Date(new Date(ms).toLocaleString('en-US', { timeZone: brand.timezone })) -
						 new Date(new Date(ms).toLocaleString('en-US', { timeZone: 'UTC' }))) / 3600000);
					check('Zeitangabe | Kürzel passt zum Versatz',
						datum.indexOf(versatz === 1 ? 'MEZ' : 'MESZ') !== -1,
						'Versatz ' + versatz + ' h, Anzeige "' + datum.trim() + '"');
					fertig();
				});
			};
			document.getElementById('frames').appendChild(f);
		}
	},
	{
		name: 'Sprachwechsel nimmt Auswahl und Anker mit',
		url: '../app/index-de.html?nur=gironde,artana#artana',
		pruefe: function (z) {
			/* Der Verweis wird erst beim Klick gesetzt, weil der Anker sich mit jeder
			 * Auswahl ändert. Geprüft wird deshalb nach einem Klick, nicht das
			 * href-Attribut im Ausgangszustand. */
			check('Sprachwechsel | Verweis trägt Auswahl und Anker',
				z.sprachLink && z.sprachLink.indexOf('nur=gironde,artana') !== -1 &&
				z.sprachLink.indexOf('#artana') !== -1,
				'Verweis "' + z.sprachLink + '"');
		}
	},
	{
		name: 'englische Fassung filtert genauso',
		url: '../app/index-en.html?nur=gironde,artana',
		pruefe: function (z) {
			check('englisch | Auswahl greift',
				z.liste.join(',') === 'gironde,artana', z.liste.join(','));
			check('englisch | Zahl im Info-Kasten stimmt',
				z.anzahl === 'two', 'Zahl "' + z.anzahl + '"');
		}
	}
];

(function next(i) {
	if (i >= FAELLE.length) {
		lines.push('DONE ' + pass + ' bestanden, ' + fail + ' fehlgeschlagen');
		document.getElementById('results').textContent = lines.join('\n');
		return;
	}
	var fall = FAELLE[i];
	if (fall.eigenesLaden) {
		fall.eigenesLaden(function () { next(i + 1); });
		return;
	}
	lade(fall.url, function (z) {
		if (z.fehler) {
			check(fall.name + ' | Fassung geladen', false, z.fehler);
		} else {
			fall.pruefe(z);
		}
		next(i + 1);
	});
})(0);
</script>
