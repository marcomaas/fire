# Sucht wöchentlich neue Waldbrand-Aktivierungen bei Copernicus und meldet sie
# als GitHub-Issue.
#
# Bewusst kein automatisches Eintragen: welcher Brand dargestellt wird, ist eine
# redaktionelle Entscheidung. Jeder weitere Eintrag kostet Aufmerksamkeit, und ein
# automatisch wachsender Auswahlblock würde die Aussage verwässern. Wie teuer ein
# Eintrag ist, lässt sich messen: der sechste (La Mierla, 01.08.2026) kostete bei
# 960×540 einen sichtbaren Eintrag in der Städteliste. Der Lauf liefert deshalb einen fertigen
# Konfigurationsblock zum Einfügen, trifft die Auswahl aber nicht selbst.
#
# Die Suche muss den EMSR-Nummernraum abtasten, weil die API keine
# Listen-Schnittstelle hat: der Parameter code ist Pflicht, ein Aufruf ohne ihn
# liefert nur ein Fehlerobjekt.

name: Neue Waldbrände suchen

on:
  schedule:
    # Montags 07:10 UTC.
    - cron: '10 7 * * 1'
  workflow_dispatch:

concurrency:
  group: discover-fires
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bin/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r bin/requirements.txt

      - name: Suchen
        id: scan
        run: |
          set +e
          python bin/fetch_ems.py --discover > found.txt 2>&1
          echo "found=$?" >> "$GITHUB_OUTPUT"
          set -e

          {
            echo '### Suchergebnis'
            echo '```'
            cat found.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Issue anlegen oder ergänzen
        if: steps.scan.outputs.found == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          week=$(date -u +'%G-KW%V')
          title="Neue Waldbrände gefunden — $week"

          {
            echo "Der wöchentliche Lauf hat Waldbrand-Aktivierungen gefunden, die noch nicht"
            echo "in der Liste \`FIRES\` in \`bin/fetch_ems.py\` stehen und mindestens zwei"
            echo "ausgelieferte Flächenprodukte haben."
            echo
            echo "Ob sie aufgenommen werden, ist eine redaktionelle Entscheidung — die"
            echo "Auswahl trifft dieser Lauf ausdrücklich nicht."
            echo
            echo '```'
            cat found.txt
            echo '```'
            echo
            echo "Nach dem Einfügen: \`python bin/fetch_ems.py <slug>\` holt nur den neuen"
            echo "Brand und übernimmt die übrigen unverändert."
          } > body.md

          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
            echo "Kommentar an Issue #$existing angefügt." >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh issue create --title "$title" --body-file body.md)
            echo "Issue angelegt: $url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Nichts gefunden
        if: steps.scan.outputs.found == '1'
        run: echo 'Keine neuen darstellbaren Waldbrände — kein Issue angelegt.' >> "$GITHUB_STEP_SUMMARY"

      # Rückgabewert 2 heißt: der Dienst hat die Suche abgewiesen, das Ergebnis
      # ist unvollständig. Das darf nicht wie ein erfolgloser Lauf aussehen —
      # sonst liest sich eine Ratenbegrenzung als "es gibt nichts Neues".
      - name: Suche war unvollständig
        if: steps.scan.outputs.found == '2'
        run: |
          {
            echo '### Suche unvollständig'
            echo
            echo 'Der Copernicus-Dienst hat die Abfrage abgewiesen (Ratenbegrenzung).'
            echo 'Bis zum Abbruch wurde nichts Neues gefunden — was darüber liegt, ist'
            echo 'UNGEPRÜFT. Der nächste wöchentliche Lauf holt es nach; bei Eile den'
            echo 'Workflow von Hand erneut starten.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
