# Läuft bei jedem Push und jedem Pull Request.
#
# Wichtig: der Datenabgleich-Workflow committet zweimal täglich neue Branddaten.
# Diese Läufe durchlaufen dieselben Tests — verändert Copernicus die Struktur
# seiner Produkte so, dass Zeitschnitte still wegfallen oder die Umrisse
# entarten, fällt das hier auf und nicht erst, wenn jemand die Grafik ansieht.

name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bin/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r bin/requirements.txt

      - name: Rechenlogik der Pipeline
        run: python tests/test_geometry.py

      - name: Syntax der Auslieferungsdateien
        run: |
          # Erzeugte Datendateien und Anwendungslogik müssen gültiges JavaScript
          # sein — eine kaputte fires.js aus dem automatischen Abgleich würde
          # sonst erst im Browser auffallen.
          for f in app/assets/js/fire.js app/assets/js/polymorph.js \
                   app/assets/data/fires.js app/assets/data/cities.js; do
            node --check "$f" && echo "OK  $f"
          done

      - name: Datenstand plausibel
        run: |
          python - <<'PY'
          import json, pathlib, sys

          text = pathlib.Path("app/assets/data/fires.js").read_text(encoding="utf-8")
          fires = json.loads(text[text.find("[") : text.rfind("]") + 1])

          fehler = []
          if not fires:
              fehler.append("keine Brände in fires.js")

          for fire in fires:
              slug = fire.get("slug", "?")
              if fire.get("mode") not in ("morph", "crossfade"):
                  fehler.append(f"{slug}: unbekannter Modus {fire.get('mode')!r}")
              steps = fire.get("steps") or []
              if not steps:
                  fehler.append(f"{slug}: keine Zeitschnitte")
              zeiten = [s["acquired"] for s in steps]
              if zeiten != sorted(zeiten):
                  fehler.append(f"{slug}: Zeitschnitte nicht chronologisch")
              for step in steps:
                  if len(step.get("polygon") or []) < 4:
                      fehler.append(f"{slug} {step['acquired']}: Umriss zu klein")
                  if (step.get("size_ha") or 0) <= 0:
                      fehler.append(f"{slug} {step['acquired']}: Fläche nicht positiv")
                  # Verbrannte Fläche verschwindet nicht wieder. Ein Rückgang wäre
                  # ein Zeichen für vertauschte oder fehlerhafte Stände.
              flaechen = [s.get("size_ha") or 0 for s in steps]
              for a, b in zip(flaechen, flaechen[1:]):
                  if b < a * 0.5:
                      fehler.append(
                          f"{slug}: Fläche halbiert sich von {a:.0f} auf {b:.0f} ha"
                      )

          for f in fehler:
              print("FAIL", f)
          print(f"{len(fires)} Brände, {sum(len(x['steps']) for x in fires)} Zeitschnitte geprüft")
          sys.exit(1 if fehler else 0)
          PY

      - name: Layout in echten Rahmen
        run: python tests/run_layout_tests.py
